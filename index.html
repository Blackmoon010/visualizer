<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLACKMOON 0-1-0 // AUDIO ENGINE</title>
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="Client-Side WebGL Audio Visualizer and Local Folder Playlist Player">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-card: rgba(18, 22, 31, 0.85);
      --bg-input: #0b0d13;
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.15);
      --cyan-glow: 0 0 16px rgba(0, 240, 255, 0.35);
      --border: #1e2638;
      --border-focus: #00f0ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --success: #00ff88;
      --danger: #ff3366;
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-primary);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Fixed WebGL visualizer background */
    #visualizerCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    header {
      background: rgba(6, 7, 10, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.25));
    }
    .brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      color: var(--cyan);
      font-weight: 700;
      line-height: 1.2;
    }
    .sub-brand {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    main {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Player Deck */
    .player-deck {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cyan);
    }

    /* Scrub Bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .progress-bar-rail {
      flex: 1;
      height: 6px;
      background: #141b29;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--cyan);
      width: 0%;
      box-shadow: var(--cyan-glow);
      transition: width 0.1s linear;
    }

    /* Transport Controls */
    .transport-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
    }
    .btn-ctrl {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .btn-ctrl:hover, .btn-ctrl.active {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: var(--cyan-glow);
    }
    .btn-ctrl-play {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #00d2ff 0%, #00f0ff 100%);
      color: #050b14;
      font-size: 1.35rem;
      border: none;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }
    .btn-ctrl-play:active { transform: scale(0.95); }

    /* Folder Loaders */
    .load-buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .btn-load {
      background: #121824;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 6px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-load:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
    }
    .btn-load.primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #002233 0%, #00384d 100%);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .hidden-input { display: none; }

    /* Playlist Queue Deck */
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }
    .queue-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .queue-count-badge {
      background: var(--cyan-dim);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .playlist-scroll {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .playlist-item {
      background: #0f131c;
      border: 1px solid #1a2233;
      border-radius: 5px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .playlist-item:hover {
      background: #141b29;
      border-color: var(--border-focus);
    }
    .playlist-item.active {
      border-color: var(--cyan);
      border-left: 4px solid var(--cyan);
      background: var(--cyan-dim);
    }
    .playlist-item-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .playlist-item.active .playlist-item-title {
      color: var(--cyan);
      font-weight: 600;
    }
    .btn-toss-track {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 3px;
      transition: color 0.15s;
    }
    .btn-toss-track:hover {
      color: var(--danger);
    }

    .empty-queue {
      text-align: center;
      padding: 30px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Background WebGL Visualizer Canvas -->
  <canvas id="visualizerCanvas"></canvas>

  <header>
    <div class="header-inner">
      <div class="logo-container">
        <img src="logo.jpg" onerror="this.src='Blackmoon Header.jpg'; this.onerror=null;" alt="BLACKMOON 0-1-0" class="brand-logo-img">
        <div>
          <div class="brand-title">// ECLIPSE AUDIO</div>
          <div class="sub-brand">STANDALONE WEBGL DECK &amp; LOCAL PLAYER</div>
        </div>
      </div>
      <div>
        <button class="btn-ctrl" id="btnVisMode" title="Toggle Visualizer Style" onclick="cycleVisMode()">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Master Transport & Active Track Deck -->
    <div class="glass-card player-deck">
      <div class="track-meta">
        <div class="track-title" id="nowTitle">No track loaded</div>
        <div class="track-artist" id="nowArtist">Tap below to load local songs</div>
      </div>

      <div class="progress-wrap">
        <span id="currTime">0:00</span>
        <div class="progress-bar-rail" id="scrubRail" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="scrubFill"></div>
        </div>
        <span id="totalTime">0:00</span>
      </div>

      <div class="transport-bar">
        <button class="btn-ctrl" onclick="toggleShuffle()" id="btnShuffle" title="Shuffle Deck">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button class="btn-ctrl" onclick="playPrev()" title="Previous Track">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button class="btn-ctrl btn-ctrl-play" id="btnPlayPause" onclick="togglePlay()" title="Play / Pause">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="btn-ctrl" onclick="playNext()" title="Next Track">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button class="btn-ctrl" onclick="toggleRepeat()" id="btnRepeat" title="Repeat Track">
          <i class="fa-solid fa-repeat"></i>
        </button>
      </div>
    </div>

    <!-- Local Media Loader Controls -->
    <div class="glass-card">
      <div class="load-buttons-grid">
        <!-- Direct Multi-File Ingestion (No "Upload" prompt) -->
        <button class="btn-load primary" onclick="document.getElementById('multiAudioInput').click()">
          <i class="fa-solid fa-music"></i> SELECT SONGS / ALBUM TRACKS (LOCAL)
        </button>
        <!-- Folder Directory Fallback -->
        <button class="btn-load" style="grid-column: span 2;" onclick="document.getElementById('folderInput').click()">
          <i class="fa-solid fa-folder-open"></i> SELECT ENTIRE FOLDER (DESKTOP / DIRECTORY)
        </button>
      </div>

      <!-- Multiple file picker without form action -->
      <input type="file" id="multiAudioInput" class="hidden-input" multiple accept="audio/*">
      <input type="file" id="folderInput" class="hidden-input" webkitdirectory directory multiple accept="audio/*">
    </div>

    <!-- Active Playlist & Toss-a-Track Deck -->
    <div class="glass-card">
      <div class="queue-header">
        <div class="queue-title">
          <i class="fa-solid fa-list-ol"></i> ACTIVE PLAYLIST DECK
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span class="queue-count-badge" id="queueBadge">0 tracks</span>
          <button class="btn-ctrl" style="width: 32px; height: 32px; font-size: 0.75rem;" onclick="clearQueue()" title="Clear Entire Queue">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>

      <div class="playlist-scroll" id="playlistContainer">
        <div class="empty-queue">[ NO TRACKS LOADED - TAP BUTTON ABOVE ]</div>
      </div>
    </div>
  </main>

  <audio id="audioElement" preload="auto"></audio>

  <script>
    // Audio engine state
    const audio = document.getElementById('audioElement');
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let dataArray = null;

    let playlist = [];
    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;
    let visMode = 0;

    // WebGL / Canvas visualizer setup
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioContext() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    // Canvas Visualizer Animation Loop
    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!analyser) {
        ctx.fillStyle = 'rgba(10, 12, 16, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = 'rgba(10, 12, 16, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const bufferLength = analyser.frequencyBinCount;

      if (visMode === 0) {
        // Mirrored Horizon Frequency Spectrum
        const barWidth = (canvas.width / bufferLength) * 1.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * (canvas.height * 0.45);
          
          const gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
          gradient.addColorStop(0, 'rgba(0, 240, 255, 0.05)');
          gradient.addColorStop(0.7, 'rgba(0, 240, 255, 0.4)');
          gradient.addColorStop(1, 'rgba(0, 255, 136, 0.9)');

          ctx.fillStyle = gradient;
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

          ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
          ctx.fillRect(x, 0, barWidth - 1, barHeight * 0.4);

          x += barWidth;
        }
      } else if (visMode === 1) {
        // Reactive Central Pulse
        const centerX = canvas.width / 2;
        const centerY = canvas.height * 0.38;
        let avg = 0;
        for (let i = 0; i < bufferLength; i++) avg += dataArray[i];
        avg = avg / bufferLength;

        const baseRadius = 60 + (avg * 0.55);

        ctx.save();
        ctx.translate(centerX, centerY);

        ctx.beginPath();
        ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 240, 255, ${Math.min(0.8, avg / 120)})`;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 24;
        ctx.shadowColor = '#00f0ff';
        ctx.stroke();

        for (let i = 0; i < bufferLength; i += 2) {
          const rads = (Math.PI * 2 / (bufferLength / 2)) * (i / 2);
          const spikeLen = (dataArray[i] / 255) * 80;
          const x1 = Math.cos(rads) * baseRadius;
          const y1 = Math.sin(rads) * baseRadius;
          const x2 = Math.cos(rads) * (baseRadius + spikeLen);
          const y2 = Math.sin(rads) * (baseRadius + spikeLen);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#00ff88';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // Cyber Oscilloscope
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f0ff';

        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 3 + (canvas.height / 3);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.stroke();
      }
    }
    requestAnimationFrame(renderVisualizer);

    function cycleVisMode() {
      visMode = (visMode + 1) % 3;
    }

    // Local Ingestion (Pure browser memory, zero upload)
    function handleFilesSelected(files) {
      const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/') || f.name.match(/\.(mp3|wav|ogg|flac|m4a|aac)$/i));
      if (audioFiles.length === 0) return;

      audioFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      audioFiles.forEach(file => {
        playlist.push({
          file: file,
          name: cleanTrackName(file.name),
          url: URL.createObjectURL(file) // Local memory pointer
        });
      });

      renderPlaylist();
      if (playlist.length === audioFiles.length) {
        loadTrack(0, false);
      }
    }

    function cleanTrackName(filename) {
      return filename.replace(/\.[^/.]+$/, "").replace(/^[0-9]+[\s_.-]*/, "");
    }

    document.getElementById('multiAudioInput').addEventListener('change', (e) => {
      handleFilesSelected(e.target.files);
    });
    document.getElementById('folderInput').addEventListener('change', (e) => {
      handleFilesSelected(e.target.files);
    });

    // Playlist Queue Mechanics
    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      document.getElementById('queueBadge').innerText = `${playlist.length} tracks`;

      if (playlist.length === 0) {
        container.innerHTML = '<div class="empty-queue">[ NO TRACKS LOADED - TAP BUTTON ABOVE ]</div>';
        document.getElementById('nowTitle').innerText = 'No track loaded';
        document.getElementById('nowArtist').innerText = 'Tap below to load local songs';
        return;
      }

      container.innerHTML = playlist.map((item, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="selectTrack(${idx})">
          <div class="playlist-item-title">${idx + 1}. ${item.name}</div>
          <button class="btn-toss-track" onclick="tossTrack(event, ${idx})" title="Toss from playlist">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      `).join('');
    }

    function tossTrack(e, index) {
      e.stopPropagation();
      URL.revokeObjectURL(playlist[index].url);
      playlist.splice(index, 1);

      if (playlist.length === 0) {
        audio.pause();
        audio.src = '';
        updatePlayIcon(false);
      } else if (index === currentIndex) {
        currentIndex = currentIndex % playlist.length;
        loadTrack(currentIndex, true);
      } else if (index < currentIndex) {
        currentIndex--;
      }
      renderPlaylist();
    }

    function clearQueue() {
      playlist.forEach(t => URL.revokeObjectURL(t.url));
      playlist = [];
      currentIndex = 0;
      audio.pause();
      audio.src = '';
      updatePlayIcon(false);
      renderPlaylist();
    }

    function selectTrack(idx) {
      currentIndex = idx;
      loadTrack(currentIndex, true);
      renderPlaylist();
    }

    function loadTrack(idx, autoPlay = true) {
      if (!playlist[idx]) return;
      initAudioContext();

      const item = playlist[idx];
      audio.src = item.url;
      document.getElementById('nowTitle').innerText = item.name;
      document.getElementById('nowArtist').innerText = item.file.webkitRelativePath ? item.file.webkitRelativePath.split('/')[0] : 'Local Media';

      if (autoPlay) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => updatePlayIcon(true)).catch(() => updatePlayIcon(false));
      }
    }

    // Transport Mechanics
    function togglePlay() {
      if (playlist.length === 0) return;
      initAudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (audio.paused) {
        if (!audio.src) loadTrack(currentIndex, true);
        else audio.play();
        updatePlayIcon(true);
      } else {
        audio.pause();
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(isPlaying) {
      const icon = document.getElementById('playIcon');
      icon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    }

    function playNext() {
      if (playlist.length === 0) return;
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      loadTrack(currentIndex, true);
      renderPlaylist();
    }

    function playPrev() {
      if (playlist.length === 0) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
      renderPlaylist();
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('btnShuffle').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('btnRepeat').classList.toggle('active', isRepeat);
    }

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        audio.currentTime = 0;
        audio.play();
      } else {
        playNext();
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      document.getElementById('scrubFill').style.width = `${progress}%`;
      document.getElementById('currTime').innerText = formatTime(audio.currentTime);
      document.getElementById('totalTime').innerText = formatTime(audio.duration);
    });

    function seekAudio(e) {
      if (!audio.duration) return;
      const rail = document.getElementById('scrubRail');
      const rect = rail.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * audio.duration;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60) || 0;
      const s = Math.floor(sec % 60) || 0;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
